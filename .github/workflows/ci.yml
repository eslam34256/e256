name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Saver/leakhunter_ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Saver/leakhunter_ai/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m py_compile app.py
      - run: pytest -q
